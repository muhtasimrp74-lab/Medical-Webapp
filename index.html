<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b2f77" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>MedStudy</title>
    <script>
      // Apply saved theme before first paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('medstudy.settings') || '{}');
        document.documentElement.dataset.theme = s.theme || 'paper';
      } catch (e) { document.documentElement.dataset.theme = 'paper'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
